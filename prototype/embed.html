<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>voice-overlay</title>
    <!-- 嵌入用的透明页：整页透明、不能滚动，胶囊由 JS 居中放进去 -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      #root {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      /* 尺寸写死 340×60：浮标窗口在拿到第一帧之前是隐藏的，隐藏时视口是 0×0，
         用百分比会把胶囊量成 0，而 0 尺寸的 canvas 在 WebKit 里拿不到 WebGL context。 */
      .canvas {
        width: 340px;
        height: 60px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- WebKitGTK 有 OffscreenCanvas，但不支持在它上面创建 WebGL2。metal-fx 会优先用
         OffscreenCanvas，于是 getContext('webgl2') 拿到 null 并抛出 "WebGL2 not supported"，
         把整棵 React 树带下去（预览页在 WebKit 里也是这样挂的，白屏）。
         藏掉它，metal-fx 就退回普通 canvas —— 普通 canvas 上 WebGL2 是正常的，金属环能画出来。
         这个页面只有浮标用，藏掉没有副作用。 -->
    <script>
      try {
        Object.defineProperty(window, 'OffscreenCanvas', { value: undefined, configurable: true });
      } catch (e) {
        window.OffscreenCanvas = undefined;
      }
    </script>
    <script type="module" src="/src/embed.tsx"></script>
  </body>
</html>
